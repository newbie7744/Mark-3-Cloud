version: "3.9"

services:
  web:
    build: .
    container_name: flask_dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - uploads_data:/app/static/uploads
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data: