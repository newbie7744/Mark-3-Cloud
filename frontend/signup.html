<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Signup</title>
    <script src="javascript/password.js"></script>
</head>
<body class="signup-page">
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form class="signup-form" action="/signup" method="POST">
            <input type="text" class="signup-input" name="name" placeholder="Name" required>
            <input type="email" class="signup-input" name="emailid" placeholder="Email ID" required>
            <input type="file" name="profile_pic" accept="image/*" class="signup-input">
<div class="password-box">
    <input type="password" id="password" class="signup-input" name="password" placeholder="Password" required>
    <span class="toggle-password" onclick="togglePassword('password')">👁</span>
</div>

<div class="password-box">
    <input type="password" id="repassword" class="signup-input" name="retype-password" placeholder="Retype Password" required>
    <span class="toggle-password" onclick="togglePassword('repassword')">👁</span>
</div>
            <button type="submit" class="signup-button">Sign Up</button>
            <p>Already have an account? <a href="/">Login</a></p>
        </form>
    </div>
</body>
</html>
